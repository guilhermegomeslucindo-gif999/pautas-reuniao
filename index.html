<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reuniões do Squad D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Clientes">
    <div class="ident"><span class="avatar" aria-hidden="true">G</span><div><b>Squad D</b><span>Guilherme, account</span></div></div>
    <div class="search-wrap"><input class="search" id="search" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente"></div>
    <div id="sideNotice"></div>
    <div class="list-label" id="listLabel">Clientes</div>
    <ul class="client-list" id="clientList"><li class="muted">Carregando clientes…</li></ul>
    <div class="add-client">
      <label for="newClient">Cadastrar cliente</label>
      <div class="add-row">
        <input id="newClient" placeholder="Nome da marmoraria" autocomplete="off">
        <button class="btn btn-primary" id="addClientBtn" type="button">Adicionar</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
